<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>

<body>

    <p>Session expire dans : <span id="timer"></span></p>

    <h1> Gestion des élèves</h1>

    <p id="welcome"></p>

    <button onclick="logout()">Logout</button>

    <div>
        <button onclick="allerEleves()">📚 Élèves</button>
        <button onclick="allerPaiements()">💰 Paiements</button>
    </div>

    <hr>

    <button onclick="openFormModal()">➕ Ajouter un élève</button>

    <!-- Formulaire d'ajout -->

    <div id="formModal" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
">

        <div style="
        background:white;
        padding:20px;
        border-radius:10px;
        width:400px;
        max-height:80vh;
        overflow:auto;
    ">

            <h2>Ajouter un élève</h2>

            <form onsubmit="submitEleve(event)">

                <input type="text" id="matricule" placeholder="Matricule" required><br><br>
                <input type="text" id="nom" placeholder="Nom" required><br><br>
                <input type="text" id="prenom" placeholder="Prénom" required><br><br>
                <input type="date" id="dateNaissance" placeholder="Année naissance" required><br><br>
                <input type="email" id="email" placeholder="Email" required><br><br>
                <input type="text" id="telephone" placeholder="Téléphone" required><br><br>
                <input type="text" id="facebook" placeholder="Facebook"><br><br>

                <select id="niveau">
                    <option value="A1">A1</option>
                    <option value="A2">A2</option>
                    <option value="B1">B1</option>
                    <option value="B2">B2</option>
                    <option value="C1">C1</option>
                    <option value="C2">C2</option>
                </select><br><br>
                <div id="loader" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    justify-content:center;
    align-items:center;
">
                    <div style="
        width:50px;
        height:50px;
        border:5px solid #ccc;
        border-top:5px solid #333;
        border-radius:50%;
        animation:spin 1s linear infinite;
    "></div>
                </div>

                <style>
                    @keyframes spin {
                        0% {
                            transform: rotate(0deg);
                        }

                        100% {
                            transform: rotate(360deg);
                        }
                    }
                </style>
                <h4>Paiement</h4>
                <input type="number" id="totalAPayer" placeholder="Total"><br><br>
                <input type="number" id="montantPaye" placeholder="Montant payé"><br><br>

                <h4>Certificats</h4>

                <label><input type="checkbox" id="A1"> A1</label>
                <label><input type="checkbox" id="A2"> A2</label>

                <br><br>

                B1:
                <label><input type="checkbox" id="B1L"> L</label>
                <label><input type="checkbox" id="B1M"> M</label>
                <label><input type="checkbox" id="B1H"> H</label>
                <label><input type="checkbox" id="B1S"> S</label>

                <br><br>

                B2:
                <label><input type="checkbox" id="B2L"> L</label>
                <label><input type="checkbox" id="B2M"> M</label>
                <label><input type="checkbox" id="B2H"> H</label>
                <label><input type="checkbox" id="B2S"> S</label>

                <br><br>

                C1:
                <label><input type="checkbox" id="C1L"> L</label>
                <label><input type="checkbox" id="C1M"> M</label>
                <label><input type="checkbox" id="C1H"> H</label>
                <label><input type="checkbox" id="C1S"> S</label>

                <br><br>

                C2:
                <label><input type="checkbox" id="C2L"> L</label>
                <label><input type="checkbox" id="C2M"> M</label>
                <label><input type="checkbox" id="C2H"> H</label>
                <label><input type="checkbox" id="C2S"> S</label>

                <br><br>

                <button type="submit">Envoyer</button>
                <button type="button" onclick="closeFormModal()">Fermer</button>

            </form>
        </div>
    </div>

    <h3>Filtrer par certificat</h3>


    <button onclick="resetFiltres()">Reset filtres</button>

    <button onclick="openModal()">Filtrer les certificats</button>

    <div id="filterModal" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
">

        <div style="
        background:white;
        padding:20px;
        border-radius:10px;
        width:400px;
        max-height:80vh;
        overflow:auto;
    ">
            <h3>Filtrer par certificat</h3>

            <div id="filters">
                <label><input type="checkbox" value="A1"> A1</label>
                <label><input type="checkbox" value="A2"> A2</label>

                <hr>

                <label><input type="checkbox" value="B1-L"> B1-L</label>
                <label><input type="checkbox" value="B1-M"> B1-M</label>
                <label><input type="checkbox" value="B1-H"> B1-H</label>
                <label><input type="checkbox" value="B1-S"> B1-S</label>

                <hr>

                <label><input type="checkbox" value="B2-L"> B2-L</label>
                <label><input type="checkbox" value="B2-M"> B2-M</label>
                <label><input type="checkbox" value="B2-H"> B2-H</label>
                <label><input type="checkbox" value="B2-S"> B2-S</label>

                <hr>

                <label><input type="checkbox" value="C1-L"> C1-L</label>
                <label><input type="checkbox" value="C1-M"> C1-M</label>
                <label><input type="checkbox" value="C1-H"> C1-H</label>
                <label><input type="checkbox" value="C1-S"> C1-S</label>

                <hr>

                <label><input type="checkbox" value="C2-L"> C2-L</label>
                <label><input type="checkbox" value="C2-M"> C2-M</label>
                <label><input type="checkbox" value="C2-H"> C2-H</label>
                <label><input type="checkbox" value="C2-S"> C2-S</label>
            </div>

            <br>

            <button onclick="filtrerEleves()">Appliquer</button>
            <button onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <!-- TABLEAU -->
    <h2>Liste des élèves</h2>


    <table border="1">
        <thead>
            <tr>
                <th>Matricule</th>
                <th>Date entrée</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Age</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Facebook</th>
                <th>Niveau</th>
                <th>Paiement</th>
                <th>Certificats</th>
            </tr>
        </thead>
        <tbody id="elevesTable"></tbody>
    </table>

    <script>
        const SESSION_KEY = "session_user";
        const SESSION_DURATION = 20 * 20 * 60 * 1000;

        /* ================= SESSION ================= */

        function getSession() {
            const session = JSON.parse(localStorage.getItem(SESSION_KEY));

            if (!session) return null;

            if (Date.now() > session.expires) {
                localStorage.removeItem(SESSION_KEY);
                return null;
            }

            return session;
        }

        function refreshSession() {
            const session = getSession();
            if (session) {
                session.expires = Date.now() + SESSION_DURATION;
                localStorage.setItem(SESSION_KEY, JSON.stringify(session));
            }
        }

        /* ================= TIMER ================= */


        function updateTimer() {
            const session = getSession();

            if (!session) return;

            const remaining = session.expires - Date.now();

            if (remaining <= 0) {
                document.getElementById("timer").innerText = "Expirée";
                localStorage.removeItem(SESSION_KEY);
                window.location.href = "login.html";
                return;
            }

            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);

            document.getElementById("timer").innerText =
                minutes + " min " + seconds + " sec";
        }

        setInterval(updateTimer, 1000);
        updateTimer();

        /* ================= NAVIGATION ================= */

        function allerEleves() {
            window.location.href = "students.html";
        }

        function allerPaiements() {
            window.location.href = "payments.html";
        }
        /* ================= PROTECTION ================= */

        const session = getSession();

        if (!session) {
            window.location.href = "login.html";
        } else {
            document.getElementById("welcome").innerText =
                "Bienvenue " + session.username;
        }

        /* ================= LOGOUT ================= */

        function logout() {
            localStorage.removeItem(SESSION_KEY);
            window.location.href = "login.html";
        }

        /* ================= INTERACTION ================= */

        document.addEventListener("click", refreshSession);
        document.addEventListener("keypress", refreshSession);
        document.addEventListener("mousemove", refreshSession);

        setInterval(() => {
            const session = getSession();
            if (!session) {
                alert("Session expirée");
                window.location.href = "login.html";
            }
        }, 60000);

        /* ================= DATA ================= */

        let eleves = [
            {
                matricule: "E001",
                dateEntree: "2025-01-10",
                nom: "Rakoto",
                prenom: "Jean",
                dateNaissance: 2000,
                email: "rakoto@mail.com",
                telephone: "0341234567",
                facebook: "jean.rakoto",
                niveau: "B1",
                paiement: {
                    statut: "payé",
                    totalAPayer: 200,
                    montantPaye: 200
                },
                certificats: {
                    A1: true,
                    A2: true,
                    B1: { L: true, M: true, H: false, S: true },
                    B2: { L: true, M: false, H: false, S: false },
                    C1: { L: false, M: false, H: false, S: false },
                    C2: { L: false, M: false, H: false, S: false }
                }
            }
        ];

        /* ================= AGE ================= */

        function calculerAge(dateNaissance) {
            return new Date().getFullYear() - dateNaissance;
        }

        /* ================= FUNCTION SUBMIT ================= */
        function convertirCertificatsEnTexte(cert) {
            let liste = [];

            if (cert.A1) liste.push("A1");
            if (cert.A2) liste.push("A2");

            if (cert.B1.L) liste.push("B1-L");
            if (cert.B1.M) liste.push("B1-M");
            if (cert.B1.H) liste.push("B1-H");
            if (cert.B1.S) liste.push("B1-S");

            if (cert.B2.L) liste.push("B2-L");
            if (cert.B2.M) liste.push("B2-M");
            if (cert.B2.H) liste.push("B2-H");
            if (cert.B2.S) liste.push("B2-S");

            if (cert.C1.L) liste.push("C1-L");
            if (cert.C1.M) liste.push("C1-M");
            if (cert.C1.H) liste.push("C1-H");
            if (cert.C1.S) liste.push("C1-S");

            if (cert.C2.L) liste.push("C2-L");
            if (cert.C2.M) liste.push("C2-M");
            if (cert.C2.H) liste.push("C2-H");
            if (cert.C2.S) liste.push("C2-S");

            return liste.join(", ");
        }
        /* ================= AFFICHAGE ================= */

        function afficherEleves(filtres = []) {
            const table = document.getElementById("elevesTable");
            table.innerHTML = ""; // reset

            eleves.forEach(eleve => {

                let certificatsValides = [];

                for (let niveau in eleve.certificats) {
                    const c = eleve.certificats[niveau];

                    if (typeof c === "boolean") {
                        if (c) certificatsValides.push(niveau);
                    } else {
                        if (c.L) certificatsValides.push(niveau + "-L");
                        if (c.M) certificatsValides.push(niveau + "-M");
                        if (c.H) certificatsValides.push(niveau + "-H");
                        if (c.S) certificatsValides.push(niveau + "-S");
                    }
                }

                // ✅ FILTRE MULTIPLE
                if (filtres.length > 0) {
                    const match = filtres.some(f => certificatsValides.includes(f));
                    if (!match) return;
                }

                let certifs = certificatsValides.join(", ");
                if (certifs === "") certifs = "Aucun";

                const paiement = `
Statut: ${eleve.paiement.statut}<br>
Total: ${eleve.paiement.totalAPayer}<br>
Payé: ${eleve.paiement.montantPaye}<br>
Reste: ${eleve.paiement.totalAPayer - eleve.paiement.montantPaye}
`;

                const age = calculerAge(eleve.dateNaissance);

                const row = document.createElement("tr");

                row.innerHTML = `
            <td>${eleve.matricule}</td>
            <td>${eleve.dateEntree}</td>
            <td>${eleve.nom}</td>
            <td>${eleve.prenom}</td>
            <td>${age}</td>
            <td>${eleve.email}</td>
            <td>${eleve.telephone}</td>
            <td>${eleve.facebook}</td>
            <td>${eleve.niveau}</td>
            <td>${paiement}</td>
            <td>${certifs}</td>
        `;

                table.appendChild(row);
            });
        }

        function getFiltresSelectionnes() {
            const checkboxes = document.querySelectorAll("#filters input[type='checkbox']");
            let filtres = [];

            checkboxes.forEach(cb => {
                if (cb.checked) {
                    filtres.push(cb.value);
                }
            });

            return filtres;
        }
        afficherEleves();

        /*==================== FILTRAGE =================*/

        function filtrerEleves() {
            const filtres = getFiltresSelectionnes();
            afficherEleves(filtres);
        }

        window.onclick = function (event) {
            const modal = document.getElementById("filterModal");
            if (event.target === modal) {
                closeModal();
            }
        }

        function resetFiltres() {
            document.querySelectorAll("#filters input").forEach(cb => cb.checked = false);
            afficherEleves([]);
        }

        function openModal() {
            document.getElementById("filterModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("filterModal").style.display = "none";
        }

        /*===============Formulaire d'ajout===============*/

        function openFormModal() {
            document.getElementById("formModal").style.display = "flex";
        }

        function closeFormModal() {
            document.getElementById("formModal").style.display = "none";
        }

        /*===============Soumission du formulaire===============*/
        const WEBHOOK_URL = "https://hook.eu1.make.com/ju8xoeo0q41g40a39328c5kfjv4wqcoe"; // Remplacer par l'URL du webhook

        function submitEleve(e) {
            const submitBtn = e.target.querySelector("button[type='submit']");
            submitBtn.disabled = true;
            submitBtn.innerText = "Envoi...";
            e.preventDefault();
            showLoader();
            const total = Number(document.getElementById("totalAPayer").value);
            const paye = Number(document.getElementById("montantPaye").value);

            // ✅ 1. On construit l'objet certificats
            const certificatsObj = {
                A1: document.getElementById("A1").checked,
                A2: document.getElementById("A2").checked,

                B1: {
                    L: document.getElementById("B1L").checked,
                    M: document.getElementById("B1M").checked,
                    H: document.getElementById("B1H").checked,
                    S: document.getElementById("B1S").checked
                },

                B2: {
                    L: document.getElementById("B2L").checked,
                    M: document.getElementById("B2M").checked,
                    H: document.getElementById("B2H").checked,
                    S: document.getElementById("B2S").checked
                },

                C1: {
                    L: document.getElementById("C1L").checked,
                    M: document.getElementById("C1M").checked,
                    H: document.getElementById("C1H").checked,
                    S: document.getElementById("C1S").checked
                },

                C2: {
                    L: document.getElementById("C2L").checked,
                    M: document.getElementById("C2M").checked,
                    H: document.getElementById("C2H").checked,
                    S: document.getElementById("C2S").checked
                }
            };

            // ✅ 2. Conversion en texte
            const certificatsTexte = convertirCertificatsEnTexte(certificatsObj);

            // ✅ 3. Création de l'élève
            const nouvelEleve = {
                matricule: document.getElementById("matricule").value,
                dateEntree: new Date().toISOString().split("T")[0],
                nom: document.getElementById("nom").value,
                prenom: document.getElementById("prenom").value,
                dateNaissance: document.getElementById("dateNaissance").value,
                email: document.getElementById("email").value,
                telephone: document.getElementById("telephone").value,
                facebook: document.getElementById("facebook").value,
                niveau: document.getElementById("niveau").value,

                paiement: {
                    totalAPayer: total,
                    montantPaye: paye,
                    statut: paye >= total ? "payé" : "partiel"
                },

                // ✅ ICI on envoie une chaîne
                certificats: certificatsObj,
                deteils: certificatsTexte
            };

            eleves.push(nouvelEleve);
            afficherEleves();
            closeFormModal();
            refreshSession();

            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(nouvelEleve)
            })
                .then(async res => {
                    let data = null;

                    try {
                        data = await res.json();
                    } catch (e) {
                        console.log("Pas de JSON retourné");
                    }

                    hideLoader();

                    if (res.ok) {
                        console.log("Réponse webhook :", data);

                        // ✅ Cas 1 : webhook retourne un statut clair
                        if (data && (data.success === true || data.status === "ok")) {
                            alert("✅ Élève envoyé avec succès !");
                        } else {
                            // ✅ Cas 2 : pas de confirmation explicite
                            alert("✅ Envoyé (réponse webhook reçue)");
                        }

                    } else {
                        alert("❌ Erreur côté webhook !");
                        console.error("HTTP error:", res.status);
                    }
                })
                .catch(err => {
                    hideLoader();
                    alert("❌ Erreur réseau !");
                    console.error(err);
                });
            submitBtn.disabled = false;
            submitBtn.innerText = "Envoyer";
        }

        /* ================= CONTROLE LOADING ================= */
        function showLoader() {
            document.getElementById("loader").style.display = "flex";
        }

        function hideLoader() {
            document.getElementById("loader").style.display = "none";
        }

        /* ================= CHARGEMENT DES ÉLÈVES ================= */
        function chargerEleves() {
            fetch("https://hook.eu1.make.com/wfh9i8r63pgt931nvclhihntyeukoxsg")
                .then(res => res.json())
                .then(data => {
                    eleves = data; // remplacer la liste locale
                    afficherEleves();
                })
                .catch(err => console.error(err));
        }

        chargerEleves();
    </script>

</body>

</html>
