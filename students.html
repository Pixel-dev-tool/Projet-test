<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>

    <script src="script/sessionPage.js"></script>
    <script src="script/affichage.js"></script>
    <script src="script/optionModal.js"></script>
    <script src="script/ajoutEtudient.js"></script>

    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            overflow: auto;
            /* IMPORTANT */
        }

        .modal.show {
            display: block;
        }

        .modal-content {
            background: white;
            margin: 40px auto;
            padding: 20px;
            width: 420px;
            max-height: 90vh;
            /* limite la hauteur */
            overflow-y: auto;
            /* scroll interne */
            border-radius: 8px;
        }

        input {
            width: 100%;
            margin-bottom: 8px;
            padding: 6px;
        }
    </style>
</head>

<body class="bodychoise">

    <header>
        <h1>Payement Page</h1>
        <button onclick="openFormModal()">Ajouter un payement
        </button>
        <button onclick="logout()">Se déconnecter</button>
        <button onclick="loadStudents()">List des Payements</button>
    </header>

    <main>

        <div id="paymentModal" class="modal">
            <div class="modal-content">
                <span onclick="closePaymentModal()">❌</span>

                <h2>💰 Paiement étudiant</h2>

                <!-- Infos étudiant -->
                <input type="text" id="p_matricule" placeholder="Matricule">
                <input type="text" id="p_nom" placeholder="Nom">
                <input type="text" id="p_prenom" placeholder="Prénom">
                <input type="text" id="p_niveau" placeholder="Niveau">

                <h4>Paiement</h4>

                <label>Total à payer</label>
                <input type="number" id="p_total">

                <label>Déjà payé</label>
                <input type="number" id="p_dejaPaye">

                <label>Montant à payer maintenant</label>
                <input type="number" id="p_montant" placeholder="Entrer le montant">

                <label>Reste après paiement</label>
                <input type="number" id="p_reste">

                <label>Mode de paiement</label>
                <select id="p_mode">
                    <option value="">Choisir</option>
                    <option value="Especes">Espèces</option>
                    <option value="MVola">MVola</option>
                    <option value="OrangeMoney">Orange Money</option>
                    <option value="AirtelMoney">Airtel Money</option>
                </select>

                <br><br>
                <button onclick="validerPaiement()">Valider</button>
            </div>
        </div>

        <!-- TABLE -->
        <table border="1" cellpadding="8">
            <thead>
                <tr>
                    <td>Ref</td>
                    <td>Mode</td>
                    <td>Nom</td>
                    <td>Prénom</td>
                    <td>Date</td>
                    <td>Matricule</td>
                    <td>Email</td>
                    <td>Niveau</td>
                    <td>totalAPayer</td>
                    <td>DejatPayer</td>
                    <td>Reste</td>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

    </main>

</body>

</html>
