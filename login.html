<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f2f2f2;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
form {
  background: white;
  padding: 20px 30px;
  border-radius: 10px;
  box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
  width: 320px;
}
input {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  margin-bottom: 15px;
  border-radius: 5px;
  border: 1px solid #ccc;
}
button {
  width: 100%;
  padding: 10px;
  border: none;
  background-color: #2b7cff;
  color: white;
  font-weight: bold;
  border-radius: 5px;
  cursor: pointer;
}
button:hover {
  background-color: #1a5bcc;
}
#message {
  color: red;
  margin-top: 10px;
  text-align: center;
}
</style>
</head>
<body>

<form id="loginForm">
  <h2>Connexion Admin</h2>
  <input type="text" id="username" placeholder="Utilisateur" required>
  <input type="password" id="password" placeholder="Mot de passe" required>
  <button type="submit">Se connecter</button>
  <div id="message"></div>
</form>

<script>
// remplacer par ton webhook Make pour login
const WEBHOOK_URL = "https://hook.eu2.make.com/w4j3pfui05b96mrlh3r9lwlbtgvmvexv";

document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  // envoyer les données au webhook Make
  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    // attendre la réponse du webhook
    const data = await res.json();

    // si le webhook indique que le login est réussi, rediriger vers dashboard
    if(data.success) {

      // login réussi → redirection vers dashboard
      window.location.href = "dashboard.html";
    } else {
      document.getElementById("message").innerText = "Utilisateur ou mot de passe incorrect";
    }
  } catch(err) {
    document.getElementById("message").innerText = "Erreur de connexion, réessayer";
    console.error(err);
  }
});
</script>

</body>
</html>
